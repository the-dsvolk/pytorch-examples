[project]
name = "pytorch-examples"
version = "0.1.0"
description = "PyTorch training and inference examples with performance benchmarking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.0",
    "ruff>=0.14.10",
    "torch>=2.9.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
# PyTorch type stubs are incomplete, so we relax some checks
typeCheckingMode = "basic"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeStubs = false
reportPrivateImportUsage = false
